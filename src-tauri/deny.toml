[advisories]
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; proc-macro used only at compile time through specta; no runtime code and no maintained drop-in under the pinned specta" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained; compile-time proc-macro pulled in on Linux through glib-macros, gtk, muda and tauri; no safe upgrade available" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained; reached through keyring, secret-service and zbus; no safe upgrade until keyring-core migrates to zbus 6, then revisit" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained; reached through keyring, secret-service and zbus; no safe upgrade until keyring-core migrates to zbus 6, then revisit" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; reached through keyring, secret-service and zbus; no safe upgrade until keyring-core migrates to zbus 6, then revisit" },
]

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
exceptions = [
  { crate = "sqlcipher-src", allow = ["blessing", "WTFPL"] },
]
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
