[package]
name = "spa-app"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
name = "spa_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.21"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
rusqlite = { version = "=0.43.0", features = ["bundled-sqlcipher-vendored-openssl"] }
keyring = "=4.2.0"
keyring-core = "=1.0.1"
getrandom = "=0.4.3"
argon2 = { version = "=0.6.0", features = ["password-hash", "getrandom"] }
hex = "=0.4.3"
zeroize = { version = "=1.9.1", features = ["derive"] }
unicode-normalization = "=0.1.26"
serde_json = "=1.0.154"

[dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }
tempfile = "=3.27.0"

[features]
real-keyring = []

[profile.dev.package.argon2]
opt-level = 3
