name: diag-macos-sigabrt

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/diag-macos-sigabrt.yml

permissions:
  contents: read

concurrency:
  group: diag-macos-sigabrt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repeat-lib-tests:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: src-tauri
      - name: build lib test binary
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "spa_app_lib" and .executable != null) | .executable' \
            | tail -1 > "${RUNNER_TEMP}/lib-test-binary.txt"
          test -x "$(cat "${RUNNER_TEMP}/lib-test-binary.txt")"
          cat "${RUNNER_TEMP}/lib-test-binary.txt"
      - name: repeat with default parallelism
        run: |
          set +e
          binary="$(cat "${RUNNER_TEMP}/lib-test-binary.txt")"
          cd src-tauri
          failures=0
          for attempt in $(seq 1 10); do
            echo "::group::parallel attempt ${attempt}"
            "$binary" --nocapture 2>&1
            status=$?
            echo "exit status ${status}"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then failures=$((failures + 1)); fi
          done
          echo "parallel failures: ${failures}/10"
          test "$failures" -eq 0
      - name: repeat single threaded
        if: always()
        run: |
          set +e
          binary="$(cat "${RUNNER_TEMP}/lib-test-binary.txt")"
          cd src-tauri
          failures=0
          for attempt in $(seq 1 3); do
            echo "::group::single thread attempt ${attempt}"
            "$binary" --nocapture --test-threads=1 2>&1
            status=$?
            echo "exit status ${status}"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then failures=$((failures + 1)); fi
          done
          echo "single thread failures: ${failures}/3"
          test "$failures" -eq 0
      - name: crash reports
        if: always()
        run: |
          for report in "${HOME}"/Library/Logs/DiagnosticReports/*; do
            [ -e "$report" ] || continue
            echo "::group::${report}"
            head -150 "$report"
            echo "::endgroup::"
          done
