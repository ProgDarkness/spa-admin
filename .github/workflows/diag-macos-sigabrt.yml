name: diag-macos-sigabrt

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/diag-macos-sigabrt.yml

permissions:
  contents: read

concurrency:
  group: diag-macos-sigabrt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repeat-lib-tests:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: src-tauri
      - name: build lib test binary
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "spa_app_lib" and .executable != null) | .executable' \
            | tail -1 > "${RUNNER_TEMP}/lib-test-binary.txt"
          test -x "$(cat "${RUNNER_TEMP}/lib-test-binary.txt")"
          cat "${RUNNER_TEMP}/lib-test-binary.txt"
      - name: only db tests, parallel, 30 runs
        run: |
          set +e
          binary="$(cat "${RUNNER_TEMP}/lib-test-binary.txt")"
          cd src-tauri
          failures=0
          for attempt in $(seq 1 30); do
            "$binary" db:: > "${RUNNER_TEMP}/db-${attempt}.log" 2>&1
            status=$?
            if [ "$status" -ne 0 ]; then
              failures=$((failures + 1))
              echo "db attempt ${attempt} exit status ${status}"
              tail -15 "${RUNNER_TEMP}/db-${attempt}.log"
            fi
          done
          echo "db-only failures: ${failures}/30"
      - name: everything except db tests, parallel, 30 runs
        if: always()
        run: |
          set +e
          binary="$(cat "${RUNNER_TEMP}/lib-test-binary.txt")"
          cd src-tauri
          failures=0
          for attempt in $(seq 1 30); do
            "$binary" --skip db:: > "${RUNNER_TEMP}/nodb-${attempt}.log" 2>&1
            status=$?
            if [ "$status" -ne 0 ]; then
              failures=$((failures + 1))
              echo "no-db attempt ${attempt} exit status ${status}"
              tail -15 "${RUNNER_TEMP}/nodb-${attempt}.log"
            fi
          done
          echo "no-db failures: ${failures}/30"
      - name: full suite under lldb, 10 runs
        if: always()
        run: |
          set +e
          binary="$(cat "${RUNNER_TEMP}/lib-test-binary.txt")"
          cd src-tauri
          for attempt in $(seq 1 10); do
            lldb --batch -o run -o "bt all" -o "register read" -o kill -- "$binary" > "${RUNNER_TEMP}/lldb-${attempt}.log" 2>&1
            if grep -q "stop reason" "${RUNNER_TEMP}/lldb-${attempt}.log"; then
              echo "::group::lldb attempt ${attempt} crashed"
              grep -A80 "stop reason" "${RUNNER_TEMP}/lldb-${attempt}.log" | head -150
              echo "::endgroup::"
            else
              echo "lldb attempt ${attempt}: no crash"
            fi
          done
