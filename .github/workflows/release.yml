name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
          else
            tag="v$(jq -r .version package.json)"
          fi
          bun scripts/release-version-cli.ts "$tag"
      - if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build:
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - if: runner.os == 'Windows'
        run: |
          choco install nasm --version=2.16.3 --yes --no-progress
          echo 'C:\Program Files\NASM' >> "$GITHUB_PATH"
      - if: runner.os == 'Windows'
        run: |
          echo 'OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe' >> "$GITHUB_ENV"
          echo 'C:\Strawberry\perl\bin' >> "$GITHUB_PATH"
      - if: runner.os == 'Windows'
        run: |
          test -x "$OPENSSL_SRC_PERL"
          "$OPENSSL_SRC_PERL" -e "use Locale::Maketext::Simple; print 1"
          "$OPENSSL_SRC_PERL" -v
          nasm -v
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.100.0
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - if: runner.os == 'Windows'
        run: bunx tauri build --bundles nsis,msi -- --locked
      - if: runner.os == 'macOS'
        run: bunx tauri build --target universal-apple-darwin --bundles dmg -- --locked
      - if: runner.os == 'macOS'
        env:
          DMG_DIR: src-tauri/target/universal-apple-darwin/release/bundle/dmg
          MOUNT_POINT: ${{ runner.temp }}/dmg-check
        run: |
          set -euo pipefail
          dmg_count="$(find "$DMG_DIR" -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')"
          test "$dmg_count" -eq 1
          dmg="$(find "$DMG_DIR" -maxdepth 1 -name '*.dmg')"
          mkdir -p "$MOUNT_POINT"
          trap 'hdiutil detach -force "$MOUNT_POINT" || true' EXIT
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$MOUNT_POINT" "$dmg"
          checked=0
          for app in "$MOUNT_POINT"/*.app; do
            test -d "$app"
            for binary in "$app"/Contents/MacOS/*; do
              archs="$(lipo -archs "$binary")"
              echo "$binary: $archs"
              [[ " $archs " == *" x86_64 "* ]]
              [[ " $archs " == *" arm64 "* ]]
              checked=$((checked + 1))
            done
          done
          test "$checked" -ge 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  assemble:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist
      - run: find dist -type f
      - run: |
          set -euo pipefail
          mkdir release-assets
          for extension in exe msi dmg; do
            mapfile -d '' matches < <(find dist -type f -name "*.${extension}" -print0)
            test "${#matches[@]}" -eq 1
            cp -- "${matches[0]}" release-assets/
          done
          cd release-assets
          mapfile -d '' names < <(find . -maxdepth 1 -type f -printf '%f\0' | sort -z)
          test "${#names[@]}" -eq 3
          for name in "${names[@]}"; do
            if [[ "$name" =~ [[:space:]] ]]; then
              echo "nombre con espacios: $name"
              exit 1
            fi
          done
          sha256sum -- "${names[@]}" > SHA256SUMS
          cat SHA256SUMS
          malformed="$(grep -Evc '^[0-9a-f]{64}  [^/[:space:]]+$' SHA256SUMS || true)"
          test "$malformed" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-assets
          if-no-files-found: error
          retention-days: 7
          path: release-assets/*

  publish:
    if: github.event_name == 'push'
    needs: assemble
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-assets
          path: release-assets
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          test "${#files[@]}" -eq 4
          gh release create "$TAG" "${files[@]}" \
            --draft \
            --verify-tag \
            --target "$TARGET_SHA" \
            --title "Spa $TAG" \
            --notes "Borrador. Verificar los instaladores con SHA256SUMS antes de distribuir."
